name: EagleEye Build 457 Focused

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-457:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'build-457-') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install -e '.[test]'
      - name: Build 457 focused regressions
        run: python -m pytest -q tests/test_build457_workspace_reliability.py
      - name: Compile Build 457 surfaces
        run: python -m compileall -q eagleeye_pro/phase20 src/eagleeye/application/build457 src/eagleeye/interfaces/web
      - name: Install isolated Build 457 runtime
        run: python INSTALL_EAGLEEYE_457.py
      - name: Verify isolated Build 457 runtime
        run: python INSTALL_EAGLEEYE_457.py --check
      - name: Linux isolated import
        if: runner.os == 'Linux'
        run: .eagleeye-runtime/bin/python -I -c "import importlib.metadata, importlib.resources, eagleeye.interfaces.web.server as s; assert importlib.metadata.version('eagleeye-personosint-pro') == '457.0.0'; assert '.eagleeye-runtime' in s.__file__; assert importlib.resources.files('eagleeye_pro.phase17').joinpath('fixtures/holdout398_cases.json').is_file(); print(s.__file__)"
      - name: Windows isolated import
        if: runner.os == 'Windows'
        run: .eagleeye-runtime\\Scripts\\python.exe -I -c "import importlib.metadata, importlib.resources, eagleeye.interfaces.web.server as s; assert importlib.metadata.version('eagleeye-personosint-pro') == '457.0.0'; assert '.eagleeye-runtime' in s.__file__; assert importlib.resources.files('eagleeye_pro.phase17').joinpath('fixtures/holdout398_cases.json').is_file(); print(s.__file__)"
      - name: Package tested Build 457 source
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git archive --format=zip --output EagleEye_Build_457_SOURCE.zip HEAD
          sha256sum EagleEye_Build_457_SOURCE.zip > EagleEye_Build_457_SOURCE.sha256
      - name: Upload tested Build 457 source
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: EagleEye_Build_457_SOURCE
          path: |
            EagleEye_Build_457_SOURCE.zip
            EagleEye_Build_457_SOURCE.sha256
          if-no-files-found: error
          retention-days: 30
