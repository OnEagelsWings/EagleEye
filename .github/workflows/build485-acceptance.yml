name: EagleEye Build 485 Full Operational Pilot Checkpoint
on:
  # Run even while the stacked PR has merge conflicts: pull_request is suppressed.
  push:
    branches: [build-485-first-case-pilot-gate]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  first-case:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install EagleEye and testing tools
        run: python -m pip install -e '.[test]'
      - name: Test all new real case gates
        run: python -m pytest -q tests/test_build485_pilot_gate.py tests/test_build484_image_links.py tests/test_build483_operator.py tests/test_build483_research_leads.py tests/test_build482_operator.py tests/test_build481_evidence_bridge.py
      - name: Real Chromium first-case usability
        run: python -m pip install 'playwright>=1.61,<2'
      - run: python -m playwright install chromium
      - run: python -m pytest -q tests/test_build485_browser.py tests/test_build482_browser.py tests/test_build481_browser.py tests/test_build480_browser.py tests/test_build478_browser.py tests/test_advanced_workflows477.py
      - name: Full canonical regression every fifth build
        run: python tools/run_checkpoint_regression480.py
      - name: Full Phase 18-20 governed regression
        run: python tools/run_checkpoint_regression480.py --phase18-20
      - name: Isolated 485 Windows Linux installation
        run: python INSTALL_EAGLEEYE_485.py
      - name: Verify package/runtime coherence
        run: python INSTALL_EAGLEEYE_485.py --check
      - name: Windows installed start
        if: runner.os == 'Windows'
        run: python tools/desktop_acceptance476.py --runtime-python .eagleeye-runtime/Scripts/python.exe
      - name: Linux installed start
        if: runner.os == 'Linux'
        run: python tools/desktop_acceptance476.py --runtime-python .eagleeye-runtime/bin/python
      - name: Windows full local case restore
        if: runner.os == 'Windows'
        run: python tools/recovery_acceptance479.py --runtime-python .eagleeye-runtime/Scripts/python.exe
      - name: Linux full local case restore
        if: runner.os == 'Linux'
        run: python tools/recovery_acceptance479.py --runtime-python .eagleeye-runtime/bin/python
      - name: Live public-domain metadata to reviewed dossier and offline restore
        run: python tools/public_pilot485.py --output checkpoint485-public.json
      - name: Package verified source archive with SHA256
        shell: bash
        run: |
          git archive --format=zip --output=EagleEye_Build_485_LAPTOP.zip HEAD
          python -c "import pathlib,zipfile,hashlib; p=pathlib.Path('EagleEye_Build_485_LAPTOP.zip'); z=zipfile.ZipFile(p); assert z.testzip() is None; assert {'START_EAGLEEYE_PRO.bat','INSTALL_EAGLEEYE_485.py','src/eagleeye/interfaces/web/app485.py','src/eagleeye/interfaces/web/pilot485.py'}.issubset(z.namelist()); pathlib.Path('EagleEye_Build_485_LAPTOP.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: EagleEye_Build_485_LAPTOP_${{ matrix.os }}
          path: |
            EagleEye_Build_485_LAPTOP.zip
            EagleEye_Build_485_LAPTOP.sha256
            checkpoint485-public.json
          if-no-files-found: error
          retention-days: 30
