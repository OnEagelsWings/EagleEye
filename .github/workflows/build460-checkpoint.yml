name: EagleEye Build 460 Full Checkpoint

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-checkpoint-460:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and validate dependencies
        run: python -m pip install -e '.[test]'
      - name: Check current app and version
        run: python -c "from eagleeye.interfaces.web.app460 import create_workspace_app460; from eagleeye_pro.version import BUILD; assert BUILD == '460.0'; print(BUILD)"
      - name: Full repository regression
        run: python tools/run_checkpoint_regression455.py
      - name: Phase 18–20 governed checkpoint
        run: python tools/run_checkpoint_regression455.py --phase18-20
      - name: Install current isolated Build 460 runtime
        run: python INSTALL_EAGLEEYE_460.py
      - name: Verify current isolated runtime
        run: python INSTALL_EAGLEEYE_460.py --check
      - name: Compile all modules
        run: python -m compileall -q src eagleeye_pro
      - name: Package tested source archive
        if: success()
        shell: bash
        run: |
          git archive --format=zip --output=EagleEye_Build_460_TESTED_SOURCE.zip HEAD
          python -c "import hashlib; from pathlib import Path; p=Path('EagleEye_Build_460_TESTED_SOURCE.zip'); Path('EagleEye_Build_460_TESTED_SOURCE.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\\n')"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: EagleEye_Build_460_TESTED_SOURCE_${{ matrix.os }}
          path: |
            EagleEye_Build_460_TESTED_SOURCE.zip
            EagleEye_Build_460_TESTED_SOURCE.sha256
          if-no-files-found: error
          retention-days: 30
