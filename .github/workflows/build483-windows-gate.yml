name: EagleEye Build 483 Fast Operational Windows Gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-live:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install current package and test tools
        run: python -m pip install -e '.[test]'
      - name: Current realistic manual-source import and authorization
        run: python -m pytest -q tests/test_build481_evidence_bridge.py tests/test_canonical_closure478.py tests/test_build482_operator.py tests/test_build483_operator.py
      - name: Real public capture + governed formal dossier + offline restore on Windows
        run: python tools/public_pilot483.py --output checkpoint483-windows-public.json
      - name: Windows isolated installer
        run: python INSTALL_EAGLEEYE_483.py
      - name: Installed runtime integrity
        run: python INSTALL_EAGLEEYE_483.py --check
      - name: Windows installed desktop startup
        run: python tools/desktop_acceptance476.py --runtime-python .eagleeye-runtime/Scripts/python.exe
      - name: Create source archive and verify contents
        shell: bash
        run: |
          git archive --format=zip --output=EagleEye_Build_483_LAPTOP.zip HEAD
          python -c "import hashlib,pathlib,zipfile; p=pathlib.Path('EagleEye_Build_483_LAPTOP.zip'); z=zipfile.ZipFile(p); assert z.testzip() is None; assert {'INSTALL_EAGLEEYE_483.py','START_EAGLEEYE_PRO.bat','src/eagleeye/interfaces/web/research483.py'}.issubset(z.namelist()); pathlib.Path('EagleEye_Build_483_LAPTOP.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+chr(10))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EagleEye_483_Fast_Windows_ReleaseCandidate
          path: |
            EagleEye_Build_483_LAPTOP.zip
            EagleEye_Build_483_LAPTOP.sha256
            checkpoint483-windows-public.json
          retention-days: 30
