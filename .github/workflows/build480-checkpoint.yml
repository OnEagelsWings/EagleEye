name: EagleEye Build 480 Operational Windows Linux Checkpoint
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  operational-checkpoint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install local source and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Install Chromium for actual GUI exercise
        run: python -m pip install 'playwright>=1.61,<2'
      - name: Install Chromium runtime
        run: python -m playwright install chromium
      - name: Compile current operational modules
        run: python -m compileall -q src/eagleeye/interfaces/web eagleeye_pro
      - name: Operational Windows Linux end to end and browser flow
        run: python -m pytest -q tests/test_build480_operational_flow.py tests/test_build480_browser.py
      - name: Full 480 checkpoint repository regression
        run: python tools/run_checkpoint_regression475.py
      - name: Phase 18 to 20 governed regression
        run: python tools/run_checkpoint_regression475.py --phase18-20
      - name: Isolated launcher runtime installation
        run: python INSTALL_EAGLEEYE_480.py
      - name: Isolated launcher runtime provenance verification
        run: python INSTALL_EAGLEEYE_480.py --check
      - name: Build downloadable, hashed source ZIP
        shell: bash
        run: |
          git archive --format=zip --output=EagleEye_Build_480_LAPTOP.zip HEAD
          python -c "import hashlib,pathlib,zipfile; p=pathlib.Path('EagleEye_Build_480_LAPTOP.zip'); h=hashlib.sha256(p.read_bytes()).hexdigest(); pathlib.Path('EagleEye_Build_480_LAPTOP.sha256').write_text(h+'  '+p.name+chr(10)); z=zipfile.ZipFile(p); assert z.testzip() is None; assert {'INSTALL_EAGLEEYE_480.py','START_EAGLEEYE_PRO.bat','src/eagleeye/interfaces/web/app480.py','src/eagleeye/interfaces/web/operations476.py'}.issubset(z.namelist())"
      - uses: actions/upload-artifact@v4
        with:
          name: EagleEye_Build_480_LAPTOP_${{ matrix.os }}
          path: |
            EagleEye_Build_480_LAPTOP.zip
            EagleEye_Build_480_LAPTOP.sha256
          if-no-files-found: error
          retention-days: 30
