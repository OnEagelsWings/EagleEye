name: EagleEye Build 480 Full Operational Integration Checkpoint
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Install Chromium browser test runtime
        run: python -m pip install 'playwright>=1.61,<2'
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Full repository regression including all AI browser versions
        run: python tools/run_checkpoint_regression480.py
      - name: Phase 18-20 regression
        run: python tools/run_checkpoint_regression480.py --phase18-20
      - name: Install focused static security scanner
        run: python -m pip install 'bandit>=1.8,<2'
      - name: Current AI boundary security scan
        run: python -m bandit -q -ll src/eagleeye/application/assistant471.py src/eagleeye/application/local_ollama471.py src/eagleeye/application/question472.py src/eagleeye/application/hypotheses473.py src/eagleeye/application/review474.py src/eagleeye/application/checkpoint475.py src/eagleeye/interfaces/web/app471.py src/eagleeye/interfaces/web/app480.py src/eagleeye/interfaces/web/hypotheses473.py src/eagleeye/interfaces/web/review474.py
      - name: Current operational boundary security scan
        run: python -m bandit -q -ll src/eagleeye/bootstrap/desktop476.py src/eagleeye/bootstrap/recovery479.py src/eagleeye/interfaces/web/operations476.py src/eagleeye/interfaces/web/sources477.py src/eagleeye/interfaces/web/findings478.py src/eagleeye/interfaces/web/report479.py src/eagleeye/interfaces/web/checkpoint480.py
      - name: Reproducible policy checks without LLM inference
        run: python tools/checkpoint475.py --output checkpoint480-policy.json
      - name: Reproduce synthetic retrieval baseline
        run: python tools/benchmark468.py --output checkpoint480-search-baseline.json
      - name: Install isolated current runtime
        run: python INSTALL_EAGLEEYE_480.py
      - name: Verify isolated current runtime
        run: python INSTALL_EAGLEEYE_480.py --check
      - name: Installed desktop process (Linux)
        if: runner.os == 'Linux'
        run: python tools/desktop_acceptance476.py --runtime-python .eagleeye-runtime/bin/python
      - name: Installed desktop process (Windows)
        if: runner.os == 'Windows'
        run: python tools/desktop_acceptance476.py --runtime-python .eagleeye-runtime/Scripts/python.exe
      - name: Installed isolated offline recovery (Linux)
        if: runner.os == 'Linux'
        run: python tools/recovery_acceptance479.py --runtime-python .eagleeye-runtime/bin/python
      - name: Installed isolated offline recovery (Windows)
        if: runner.os == 'Windows'
        run: python tools/recovery_acceptance479.py --runtime-python .eagleeye-runtime/Scripts/python.exe
      - name: Actual public metadata pilot (outages recorded as FAIL, no mock fallback)
        run: python tools/public_pilot480.py --output checkpoint480-live-public.json
      - name: Package and verify laptop build
        shell: bash
        run: |
          git archive --format=zip --output=EagleEye_Build_480_LAPTOP.zip HEAD
          python -c "import hashlib,pathlib,zipfile; p=pathlib.Path('EagleEye_Build_480_LAPTOP.zip'); h=hashlib.sha256(p.read_bytes()).hexdigest(); pathlib.Path('EagleEye_Build_480_LAPTOP.sha256').write_text(h+'  '+p.name+chr(10)); z=zipfile.ZipFile(p); assert z.testzip() is None; assert {'INSTALL_EAGLEEYE_480.py','START_EAGLEEYE_PRO.bat','START_EAGLEEYE_PRO.sh','src/eagleeye/interfaces/web/app480.py'}.issubset(z.namelist())"
      - name: Record package provenance
        shell: bash
        run: |
          python -c "import hashlib,json,pathlib,subprocess,zipfile; p=pathlib.Path('EagleEye_Build_480_LAPTOP.zip'); z=zipfile.ZipFile(p); proof={'build':'480.0','archive':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'crc_valid':z.testzip() is None,'files':len(z.namelist()),'packaged_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'posix_launcher_mode':oct(z.getinfo('START_EAGLEEYE_PRO.sh').external_attr>>16)}; pathlib.Path('checkpoint480-package-proof.json').write_text(json.dumps(proof,indent=2)); print(json.dumps(proof))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EagleEye_Build_480_LAPTOP_${{ matrix.os }}
          path: |
            EagleEye_Build_480_LAPTOP.zip
            EagleEye_Build_480_LAPTOP.sha256
            checkpoint480-policy.json
            checkpoint480-search-baseline.json
            checkpoint480-live-public.json
            recovery-acceptance479.json
            checkpoint480-package-proof.json
          if-no-files-found: error
          retention-days: 30
