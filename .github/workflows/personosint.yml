name: PersonOSINT Tests (Windows und Linux)

on:
  pull_request:
    paths:
      - 'PersonOSINT/**'
      - '.github/workflows/personosint.yml'
      # Vault + Fallakte: die Fallakte kommt aus dem EagleEye-Hauptpaket
      - 'src/eagleeye/**'
      - 'eagleeye_pro/**'
      - 'pyproject.toml'
      - 'tests/test_vault_fallakte.py'
      - 'tests/test_personosint*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personosint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: PersonOSINT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: PersonOSINT/requirements.txt
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt
      - name: Startbefehl und Paketbau
        run: |
          python -m personosint --help
          python -m pip wheel . --no-deps -w dist
      - name: Tests
        env:
          PYTHONUTF8: '1'
        run: python -m pytest -q

  # Vault mit EagleEye-Fallakte: in build-validation fehlt die PersonOSINT-Laufzeit, dort wird dieser Test
  # übersprungen. Hier laufen beide Teile zusammen, auch unter Windows, wo der Vault eingesetzt wird.
  vault-fallakte:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            PersonOSINT/requirements.txt
            pyproject.toml
      - name: EagleEye und PersonOSINT installieren
        run: |
          python -m pip install -e ".[test]"
          python -m pip install -r PersonOSINT/requirements.txt
      - name: Vault, Fallakte und Brücke
        env:
          PYTHONUTF8: '1'
        run: python -m pytest -q -ra tests/test_vault_fallakte.py tests/test_personosint_engine501.py tests/test_personosint_single_source503.py tests/test_personosint_analysis_api_privacy503.py
