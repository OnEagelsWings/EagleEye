name: EagleEye Build 453 Focused

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-453:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install -e '.[test]'
      - name: Historical/recovery focused regressions
        run: python -m pytest -q tests/test_build453_historical_recovery.py
      - name: Install isolated Build 453 runtime
        run: python INSTALL_EAGLEEYE_453.py
      - name: Verify isolated Build 453 runtime
        run: python INSTALL_EAGLEEYE_453.py --check
      - name: Linux isolated import
        if: runner.os == 'Linux'
        run: .eagleeye-runtime/bin/python -I -c "import importlib.metadata, eagleeye.interfaces.web.server as s; assert importlib.metadata.version('eagleeye-personosint-pro') == '453.0.0'; assert '.eagleeye-runtime' in s.__file__; print(s.__file__)"
      - name: Windows isolated import
        if: runner.os == 'Windows'
        run: .eagleeye-runtime\\Scripts\\python.exe -I -c "import importlib.metadata, eagleeye.interfaces.web.server as s; assert importlib.metadata.version('eagleeye-personosint-pro') == '453.0.0'; assert '.eagleeye-runtime' in s.__file__; print(s.__file__)"
