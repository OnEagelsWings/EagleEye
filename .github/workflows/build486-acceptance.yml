name: EagleEye Build 486 Windows Start and Preservation
on:
  push:
    branches: [build-486-windows-start-preservation]
  pull_request:
    branches: [build-485-first-case-pilot-gate]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  preservation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install EagleEye and testing tools
        run: python -m pip install -e '.[test]'
      - name: Workspace preservation, first start and runtime identity
        run: python -m pytest -q tests/test_build486_startup.py
      - name: Previous real case, source and image integrity gates
        run: python -m pytest -q tests/test_build485_pilot_gate.py tests/test_build484_image_links.py tests/test_build483_operator.py tests/test_build483_research_leads.py tests/test_build482_operator.py tests/test_build481_evidence_bridge.py
      - name: Install Chromium browser regression
        run: python -m pip install 'playwright>=1.61,<2'
      - run: python -m playwright install chromium
      - name: Real browser first-case and inherited workflows
        run: python -m pytest -q tests/test_build486_browser.py tests/test_build485_browser.py tests/test_build482_browser.py tests/test_build481_browser.py tests/test_build480_browser.py tests/test_build478_browser.py tests/test_advanced_workflows477.py
      - name: Compile startup and application
        run: python -m compileall -q src/eagleeye/bootstrap src/eagleeye/interfaces/web eagleeye_pro
      - name: Isolated 486 installation
        run: python INSTALL_EAGLEEYE_486.py
      - name: Verify installed runtime
        run: python INSTALL_EAGLEEYE_486.py --check
      - name: Windows installed first start
        if: runner.os == 'Windows'
        run: python tools/desktop_acceptance476.py --runtime-python .eagleeye-runtime/Scripts/python.exe
      - name: Linux installed first start
        if: runner.os == 'Linux'
        run: python tools/desktop_acceptance476.py --runtime-python .eagleeye-runtime/bin/python
      - name: Windows full case recovery
        if: runner.os == 'Windows'
        run: python tools/recovery_acceptance479.py --runtime-python .eagleeye-runtime/Scripts/python.exe
      - name: Linux full case recovery
        if: runner.os == 'Linux'
        run: python tools/recovery_acceptance479.py --runtime-python .eagleeye-runtime/bin/python
      - name: Build 486 archive with SHA256
        shell: bash
        run: |
          git archive --format=zip --output=EagleEye_Build_486_LAPTOP.zip HEAD
          python -c "import pathlib,zipfile,hashlib; p=pathlib.Path('EagleEye_Build_486_LAPTOP.zip'); z=zipfile.ZipFile(p); assert z.testzip() is None; assert {'START_EAGLEEYE_PRO.bat','INSTALL_EAGLEEYE_486.py','src/eagleeye/interfaces/web/app486.py','tests/test_build486_startup.py'}.issubset(z.namelist()); pathlib.Path('EagleEye_Build_486_LAPTOP.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name + chr(10))"
      - uses: actions/upload-artifact@v4
        with:
          name: EagleEye_Build_486_LAPTOP_${{ matrix.os }}
          path: |
            EagleEye_Build_486_LAPTOP.zip
            EagleEye_Build_486_LAPTOP.sha256
          if-no-files-found: error
          retention-days: 30
