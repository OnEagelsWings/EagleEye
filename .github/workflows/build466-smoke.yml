name: EagleEye Build 466 Quick Smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test provenance browser
        run: python -m pytest -q tests/test_build466_provenance_smoke.py
      - name: Package laptop build
        shell: bash
        run: |
          git archive --format=zip --output=EagleEye_Build_466_LAPTOP.zip HEAD
          python -c "import hashlib,pathlib; p=pathlib.Path('EagleEye_Build_466_LAPTOP.zip');pathlib.Path('EagleEye_Build_466_LAPTOP.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+chr(10))"
      - uses: actions/upload-artifact@v4
        with:
          name: EagleEye_Build_466_LAPTOP_${{ matrix.os }}
          path: |
            EagleEye_Build_466_LAPTOP.zip
            EagleEye_Build_466_LAPTOP.sha256
          retention-days: 30
