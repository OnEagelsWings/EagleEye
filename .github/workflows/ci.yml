name: EagleEye CI

on:
  push:
    branches: [ main, eagleeye/build-400 ]
  pull_request:

jobs:
  build-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install EagleEye
        run: python -m pip install -e '.[test]'
      - name: Determine five-build test cadence
        id: cadence
        shell: bash
        run: |
          python - <<'PY'
          import os
          from eagleeye_pro.version import BUILD
          build_number = int(BUILD.split(".", 1)[0])
          full = build_number % 5 == 0
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"full={'true' if full else 'false'}\n")
              handle.write(f"build_number={build_number}\n")
          print(f"Build {BUILD}: {'full checkpoint' if full else 'focused development'} test cadence")
          PY
      - name: Current import smoke
        run: python -c "from eagleeye.interfaces.web.server import serve_workspace; from eagleeye.interfaces.web.app453 import create_workspace_app453; from eagleeye_pro.version import BUILD; assert BUILD == '453.0'; print(BUILD)"
      - name: Build 453 focused historical/recovery tests
        run: pytest -q tests/test_build453_historical_recovery.py
      - name: Compile current web and phase20 surfaces
        run: python -m compileall -q src/eagleeye/interfaces/web src/eagleeye/application/build453 eagleeye_pro/phase20
      - name: Full repository checkpoint regression
        if: steps.cadence.outputs.full == 'true'
        run: pytest -q tests --ignore=tests/test_build360.py --ignore=tests/test_build361.py --ignore=tests/test_build362.py --ignore=tests/test_build363.py --ignore=tests/test_build364.py
      - name: Phase 18-20 checkpoint chain
        if: steps.cadence.outputs.full == 'true'
        run: pytest -q tests/test_build413_integrated.py tests/test_build414_integrated.py tests/test_build415_integrated.py tests/test_build416_integrated.py tests/test_build417_integrated.py tests/test_build418_integrated.py tests/test_build419_integrated.py tests/test_build420_integrated.py tests/test_build421_integrated.py tests/test_build422_integrated.py tests/test_build423_integrated.py tests/test_build424_integrated.py tests/test_build425_integrated.py tests/test_build426_integrated.py tests/test_build427_integrated.py tests/test_build428_integrated.py tests/test_build429_integrated.py tests/test_build430_integrated.py tests/test_build431_integrated.py tests/test_build432_integrated.py tests/test_build433_integrated.py tests/test_build434_integrated.py tests/test_build435_integrated.py tests/test_build436_integrated.py tests/test_build437_integrated.py tests/test_build438_integrated.py tests/test_build439_integrated.py tests/test_build440_integrated.py tests/test_build441_integrated.py tests/test_build442_integrated.py tests/test_build443_integrated.py tests/test_build444_integrated.py tests/test_build445_integrated.py tests/test_build446_integrated.py tests/test_build447_integrated.py tests/test_build448_integrated.py tests/test_build449_integrated.py tests/test_build450_integrated.py
