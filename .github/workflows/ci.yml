name: EagleEye CI

on:
  push:
    branches: [ main, eagleeye/build-400, build-485-first-case-pilot-gate, build-486-windows-start-preservation, build-487-case-source-provenance ]
  pull_request:

# Cancel obsolete CI attempts when a newer commit arrives on the same PR.
concurrency:
  group: eagleeye-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install EagleEye
        run: python -m pip install -e '.[test]'
      # The repository checkpoint includes a real Chromium browser assertion.
      # Provision its dependency instead of silently skipping or weakening it.
      - name: Install Chromium for browser security regression
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Determine five-build test cadence
        id: cadence
        shell: bash
        run: |
          python - <<'PY'
          import os
          from eagleeye_pro.version import BUILD
          build_number = int(BUILD.split(".", 1)[0])
          full = (build_number % 5 == 0 and build_number < 500)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"full={'true' if full else 'false'}\n")
              handle.write(f"build_number={build_number}\n")
          print(f"Build {BUILD}: {'full checkpoint' if full else 'focused development'} test cadence")
          PY
      - name: Current import smoke
        run: python -c "from eagleeye.interfaces.web.server import serve_workspace; from eagleeye.interfaces.web.app489 import create_workspace_app489; from eagleeye_pro.version import BUILD; assert BUILD in {'490.0','500.0'}; print(BUILD)"
      - name: Build 458 focused integration tests
        if: steps.cadence.outputs.full != 'true'
        run: pytest -q tests/test_build458_document_intelligence.py -k 'not test_build458_current_installer_and_next_checkpoint'
      - name: Compile current web and phase20 surfaces
        run: python -m compileall -q src/eagleeye/interfaces/web src/eagleeye/application/build458 eagleeye_pro/phase20
      # Fail fast on the active Build-490 integration rather than historical
      # Build-486 exact-version contracts. Historical failures remain visible
      # in the mandatory full checkpoint below.
      - name: Current legacy preflight (prior to Build 500)
        if: steps.cadence.outputs.full == 'true'
        run: pytest -q -x tests/test_build490_synthetic_journey.py
      - name: Full repository checkpoint regression
        if: steps.cadence.outputs.full == 'true'
        run: python tools/run_checkpoint_regression480.py
      # The repository-wide checkpoint already includes Phase 18-20 tests.
      # Do not run the same suites twice in this workflow.
