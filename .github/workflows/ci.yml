name: EagleEye CI

on:
  push:
    branches: [ main, eagleeye/build-400 ]
  pull_request:

jobs:
  build-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install EagleEye
        run: python -m pip install -e '.[test]'
      - name: Determine five-build test cadence
        id: cadence
        shell: bash
        run: |
          python - <<'PY'
          import os
          from eagleeye_pro.version import BUILD
          build_number = int(BUILD.split(".", 1)[0])
          full = build_number % 5 == 0
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"full={'true' if full else 'false'}\n")
              handle.write(f"build_number={build_number}\n")
          print(f"Build {BUILD}: {'full checkpoint' if full else 'focused development'} test cadence")
          PY
      - name: Current import smoke
        run: python -c "from eagleeye.interfaces.web.server import serve_workspace; from eagleeye.interfaces.web.app457 import create_workspace_app457; from eagleeye_pro.version import BUILD; assert BUILD == '457.0'; print(BUILD)"
      - name: Build 457 focused integration tests
        run: pytest -q tests/test_build457_workspace_reliability.py
      - name: Compile current web and phase20 surfaces
        run: python -m compileall -q src/eagleeye/interfaces/web src/eagleeye/application/build457 eagleeye_pro/phase20
      - name: Full repository checkpoint regression
        if: steps.cadence.outputs.full == 'true'
        run: python tools/run_checkpoint_regression455.py
      - name: Phase 18-20 checkpoint chain
        if: steps.cadence.outputs.full == 'true'
        run: python tools/run_checkpoint_regression455.py --phase18-20
