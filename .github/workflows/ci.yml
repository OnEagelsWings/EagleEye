name: EagleEye CI

on:
  push:
    branches: [ main, eagleeye/build-400, build-485-first-case-pilot-gate, build-486-windows-start-preservation, build-487-case-source-provenance ]
  pull_request:

# Cancel obsolete CI attempts when a newer commit arrives on the same PR.
concurrency:
  group: eagleeye-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install EagleEye
        run: python -m pip install -e '.[test]'
      - name: Determine five-build test cadence
        id: cadence
        shell: bash
        run: |
          python - <<'PY'
          import os
          from eagleeye_pro.version import BUILD
          build_number = int(BUILD.split(".", 1)[0])
          full = build_number % 5 == 0
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"full={'true' if full else 'false'}\n")
              handle.write(f"build_number={build_number}\n")
          print(f"Build {BUILD}: {'full checkpoint' if full else 'focused development'} test cadence")
          PY
      - name: Current import smoke
        run: python -c "from eagleeye.interfaces.web.server import serve_workspace; from eagleeye.interfaces.web.app489 import create_workspace_app489; from eagleeye_pro.version import BUILD; assert BUILD == '490.0'; print(BUILD)"
      - name: Build 458 focused integration tests
        if: steps.cadence.outputs.full != 'true'
        run: pytest -q tests/test_build458_document_intelligence.py -k 'not test_build458_current_installer_and_next_checkpoint'
      - name: Compile current web and phase20 surfaces
        run: python -m compileall -q src/eagleeye/interfaces/web src/eagleeye/application/build458 eagleeye_pro/phase20
      # Check known current-workflow regressions first: fail in seconds, not after
      # an eight-minute repository checkpoint. The full gate remains mandatory.
      - name: Current case and startup regression preflight
        if: steps.cadence.outputs.full == 'true'
        run: pytest -q -x tests/test_build489_checkpoint.py tests/test_build489_checkpoint_rendering.py tests/test_build486_startup.py
      - name: Full repository checkpoint regression
        if: steps.cadence.outputs.full == 'true'
        run: python tools/run_checkpoint_regression480.py
      - name: Phase 18-20 checkpoint chain
        if: steps.cadence.outputs.full == 'true'
        run: python tools/run_checkpoint_regression480.py --phase18-20
