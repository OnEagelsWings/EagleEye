name: EagleEye Retrieval Isolation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-worker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and tests
        run: python -m pip install -e '.[test]'
      - name: Worker boundary regressions
        run: python -m pytest -q tests/test_build451_retrieval_isolation.py
      - name: Build installable wheel
        run: python -m pip wheel --no-deps . --wheel-dir worker-wheels
      - name: Verify installed worker outside checkout
        run: python tools/check_retrieval451_wheel.py --wheel-dir worker-wheels
