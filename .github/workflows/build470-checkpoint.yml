name: EagleEye Build 470 Full Checkpoint

on:
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: '1'

permissions:
  contents: read

jobs:
  full-checkpoint-470:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and validate dependencies
        run: python -m pip install -e '.[test]'
      - name: Check current app and version
        run: python -c "from eagleeye.interfaces.web.app470 import create_workspace_app470; from eagleeye_pro.version import BUILD; assert BUILD == '470.0'; print(BUILD)"
      - name: Full repository regression
        run: python tools/run_checkpoint_regression470.py
      - name: Phase 18–20 governed checkpoint
        run: python tools/run_checkpoint_regression470.py --phase18-20
      - name: Install current isolated Build 470 runtime
        run: python INSTALL_EAGLEEYE_470.py
      - name: Verify current isolated runtime
        run: python INSTALL_EAGLEEYE_470.py --check
      - name: Compile all modules
        run: python -m compileall -q src eagleeye_pro
      - name: Package tested source archive
        if: success()
        shell: bash
        run: |
          git archive --format=zip --output=EagleEye_Build_470_TESTED_SOURCE.zip HEAD
          python -c "import hashlib; from pathlib import Path; p=Path('EagleEye_Build_470_TESTED_SOURCE.zip'); Path('EagleEye_Build_470_TESTED_SOURCE.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+chr(10))"
      - name: Verify downloadable artifact and launch contract
        shell: bash
        run: |
          python -c "import hashlib, pathlib, zipfile; p=pathlib.Path('EagleEye_Build_470_TESTED_SOURCE.zip'); expected=pathlib.Path('EagleEye_Build_470_TESTED_SOURCE.sha256').read_text().split()[0]; actual=hashlib.sha256(p.read_bytes()).hexdigest(); assert expected==actual, 'SHA256 mismatch'; z=zipfile.ZipFile(p); required={'INSTALL_EAGLEEYE_470.py','START_EAGLEEYE_PRO.sh','START_EAGLEEYE_PRO.bat','src/eagleeye/interfaces/web/app470.py'}; assert required.issubset(z.namelist()), 'Build 470 launch files missing'; assert z.testzip() is None, 'Corrupted archive'"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: EagleEye_Build_470_TESTED_SOURCE_${{ matrix.os }}
          path: |
            EagleEye_Build_470_TESTED_SOURCE.zip
            EagleEye_Build_470_TESTED_SOURCE.sha256
          if-no-files-found: error
          retention-days: 30
