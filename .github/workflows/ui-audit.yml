name: EagleEye UI Audit

on:
  pull_request:
  schedule:
    - cron: '15 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install EagleEye
        run: python -m pip install -e '.[test]'
      - name: Current UI import smoke
        run: python -c "from eagleeye.interfaces.web.app455 import create_workspace_app455; from eagleeye.interfaces.web.app448 import render_workspace; from eagleeye_pro.version import BUILD; assert BUILD == '455.0'; print(BUILD)"
      - name: Build 455 current health/status UI contract
        run: pytest -q tests/test_build455_operational_checkpoint.py -k 'status_health'
      - name: Compile current web surface
        run: python -m compileall -q src/eagleeye/interfaces/web eagleeye_pro/phase20
