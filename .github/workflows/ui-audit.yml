name: EagleEye UI Audit

on:
  schedule:
    - cron: '15 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install EagleEye
        run: python -m pip install -e '.[test]'
      - name: Current UI import smoke
        run: python -c "from eagleeye.interfaces.web.app448 import create_workspace_app448, render_workspace; from eagleeye_pro.version import BUILD; assert BUILD == '448.0'; print(BUILD)"
      - name: Investigator workspace and UI functionality audit
        run: pytest -q tests/test_build448_integrated.py
      - name: Compile current web surface
        run: python -m compileall -q src/eagleeye/interfaces/web eagleeye_pro/phase20
