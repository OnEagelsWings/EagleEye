name: EagleEye UI Audit

on:
  pull_request:
  schedule:
    - cron: '15 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install EagleEye
        run: python -m pip install -e '.[test]'
      - name: Current UI import smoke
        run: python -c "from eagleeye.interfaces.web.app480 import create_workspace_app480; from eagleeye.interfaces.web.app448 import render_workspace; from eagleeye_pro.version import BUILD; assert BUILD == '480.0'; print(BUILD)"
      - name: Build 458 current health/status UI contract
        run: pytest -q tests/test_build458_document_intelligence.py -k 'health_and_authenticated_upload'
      - name: Investigator UI regression suite
        run: pytest -q tests/test_build448_integrated.py tests/test_build449_integrated.py tests/test_build450_integrated.py -k 'not test_status_and_launcher_contract and not test_status_launcher_and_checkpoint_contract and not test_build450_status_launcher_manifest_and_checkpoint_contract'
      - name: Compile current web surface
        run: python -m compileall -q src/eagleeye/interfaces/web eagleeye_pro/phase20
