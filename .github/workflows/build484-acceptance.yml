name: EagleEye Build 484 Windows Linux Case Acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install product and test tools
        run: python -m pip install -e '.[test]'
      - name: Image, search and case-specific security tests
        run: python -m pytest -q tests/test_build484_image_links.py tests/test_build483_research_leads.py tests/test_build482_operator.py tests/test_build481_evidence_bridge.py
      - name: Compile all current interfaces
        run: python -m compileall -q src/eagleeye/interfaces/web eagleeye_pro
      - name: Install current build
        run: python INSTALL_EAGLEEYE_484.py
      - name: Verify installed runtime
        run: python INSTALL_EAGLEEYE_484.py --check
      - name: Windows application startup
        if: runner.os == 'Windows'
        run: python tools/desktop_acceptance476.py --runtime-python .eagleeye-runtime/Scripts/python.exe
      - name: Linux application startup
        if: runner.os == 'Linux'
        run: python tools/desktop_acceptance476.py --runtime-python .eagleeye-runtime/bin/python
      - name: Windows case restore
        if: runner.os == 'Windows'
        run: python tools/recovery_acceptance479.py --runtime-python .eagleeye-runtime/Scripts/python.exe
      - name: Linux case restore
        if: runner.os == 'Linux'
        run: python tools/recovery_acceptance479.py --runtime-python .eagleeye-runtime/bin/python
      - name: Produce hashed Windows Linux release archive
        shell: bash
        run: |
          git archive --format=zip --output=EagleEye_Build_484_LAPTOP.zip HEAD
          python -c "import pathlib,zipfile,hashlib; p=pathlib.Path('EagleEye_Build_484_LAPTOP.zip'); z=zipfile.ZipFile(p); assert z.testzip() is None; assert {'START_EAGLEEYE_PRO.bat','INSTALL_EAGLEEYE_484.py','src/eagleeye/interfaces/web/app484.py','src/eagleeye/interfaces/web/media484.py'}.issubset(z.namelist()); pathlib.Path('EagleEye_Build_484_LAPTOP.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: EagleEye_Build_484_LAPTOP_${{ matrix.os }}
          path: |
            EagleEye_Build_484_LAPTOP.zip
            EagleEye_Build_484_LAPTOP.sha256
          if-no-files-found: error
          retention-days: 30
