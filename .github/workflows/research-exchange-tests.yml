name: Research exchange regression
on:
  pull_request:
    paths:
      - 'tools/research_exchange/**'
      - '.github/workflows/research-exchange-tests.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic local Git regression
        run: python -m unittest discover -s tools/research_exchange -p 'test_*.py' -v
