name: EagleEye Build 455 Hard Checkpoint

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Build 455 checkpoint integration tests
        run: python -m pytest -q tests/test_build455_operational_checkpoint.py
      - name: Real public-source operational qualification
        run: python tools/build455_live_public_gate.py
      - name: Verify live qualification result
        run: python -c "import json; d=json.load(open('build455_live_result.json',encoding='utf-8')); assert d['result']=='PASS' and d['overall_result']=='pass' and d['restart_result']=='pass'; print(json.dumps(d,indent=2))"
      - name: Compile current checkpoint surfaces
        run: python -m compileall -q src/eagleeye/interfaces/web src/eagleeye/application/build455 eagleeye_pro/phase20 tools/build455_live_public_gate.py
      - name: Install isolated Build 455 runtime
        run: python INSTALL_EAGLEEYE_455.py
      - name: Verify isolated Build 455 runtime
        run: python INSTALL_EAGLEEYE_455.py --check
      - name: Isolated import
        run: .eagleeye-runtime/bin/python -I -c "import importlib.metadata, eagleeye.interfaces.web.server as s; assert importlib.metadata.version('eagleeye-personosint-pro') == '455.0.0'; assert '.eagleeye-runtime' in s.__file__; print(s.__file__)"
      - name: Package tested Build 455 source
        shell: bash
        run: |
          git archive --format=zip --output EagleEye_Build_455_SOURCE.zip HEAD
          sha256sum EagleEye_Build_455_SOURCE.zip > EagleEye_Build_455_SOURCE.sha256
          sha256sum build455_live_result.json > build455_live_result.sha256
      - name: Upload tested Build 455 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: EagleEye_Build_455_CHECKPOINT
          path: |
            EagleEye_Build_455_SOURCE.zip
            EagleEye_Build_455_SOURCE.sha256
            build455_live_result.json
            build455_live_result.sha256
          if-no-files-found: error
          retention-days: 30

  checkpoint-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Build 455 checkpoint integration tests
        run: python -m pytest -q tests/test_build455_operational_checkpoint.py
      - name: Install isolated Build 455 runtime
        run: python INSTALL_EAGLEEYE_455.py
      - name: Verify isolated Build 455 runtime
        run: python INSTALL_EAGLEEYE_455.py --check
      - name: Windows isolated import
        run: .eagleeye-runtime\\Scripts\\python.exe -I -c "import importlib.metadata, eagleeye.interfaces.web.server as s; assert importlib.metadata.version('eagleeye-personosint-pro') == '455.0.0'; assert '.eagleeye-runtime' in s.__file__; print(s.__file__)"
