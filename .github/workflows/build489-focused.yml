name: EagleEye Build 489 Focused Smoke
on:
  push:
    branches: [build-489-review-provenance-workflow]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  checkpoint-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e '.[test]'
      - name: Build 489 focused smoke
        run: python -m pytest -q tests/test_build489_checkpoint.py tests/test_build489_source_integrity.py
      - name: Compile checkpoint
        run: python -m compileall -q src/eagleeye/interfaces/web/checkpoint489.py src/eagleeye/interfaces/web/app489.py
