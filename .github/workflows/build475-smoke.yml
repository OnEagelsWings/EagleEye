name: EagleEye Build 475 Full AI Security Checkpoint
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Install Chromium browser test runtime
        run: python -m pip install 'playwright>=1.61,<2'
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Full repository regression including all AI browser versions
        run: python tools/run_checkpoint_regression475.py
      - name: Phase 18-20 regression
        run: python tools/run_checkpoint_regression475.py --phase18-20
      - name: Install focused static security scanner
        run: python -m pip install 'bandit>=1.8,<2'
      - name: Current AI boundary security scan
        run: python -m bandit -q -ll src/eagleeye/application/assistant471.py src/eagleeye/application/local_ollama471.py src/eagleeye/application/question472.py src/eagleeye/application/hypotheses473.py src/eagleeye/application/review474.py src/eagleeye/application/checkpoint475.py src/eagleeye/interfaces/web/app471.py src/eagleeye/interfaces/web/app475.py src/eagleeye/interfaces/web/hypotheses473.py src/eagleeye/interfaces/web/review474.py
      - name: Reproducible policy checks without LLM inference
        run: python tools/checkpoint475.py --output checkpoint475-policy.json
      - name: Reproduce synthetic retrieval baseline
        run: python tools/benchmark468.py --output checkpoint475-search-baseline.json
      - name: Install isolated current runtime
        run: python INSTALL_EAGLEEYE_475.py
      - name: Verify isolated current runtime
        run: python INSTALL_EAGLEEYE_475.py --check
      - name: Package and verify laptop build
        shell: bash
        run: |
          git archive --format=zip --output=EagleEye_Build_475_LAPTOP.zip HEAD
          python -c "import hashlib,pathlib,zipfile; p=pathlib.Path('EagleEye_Build_475_LAPTOP.zip'); h=hashlib.sha256(p.read_bytes()).hexdigest(); pathlib.Path('EagleEye_Build_475_LAPTOP.sha256').write_text(h+'  '+p.name+chr(10)); z=zipfile.ZipFile(p); assert z.testzip() is None; assert {'INSTALL_EAGLEEYE_475.py','START_EAGLEEYE_PRO.bat','START_EAGLEEYE_PRO.sh','src/eagleeye/interfaces/web/app475.py'}.issubset(z.namelist())"
      - uses: actions/upload-artifact@v4
        with:
          name: EagleEye_Build_475_LAPTOP_${{ matrix.os }}
          path: |
            EagleEye_Build_475_LAPTOP.zip
            EagleEye_Build_475_LAPTOP.sha256
            checkpoint475-policy.json
            checkpoint475-search-baseline.json
          if-no-files-found: error
          retention-days: 30
