name: EagleEye Build 485 Hard Gate Public Research Windows Linux
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  operational-hard-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and tests
        run: python -m pip install -e '.[test]'
      - name: Current and historical source / image / Dork / Evidence checks
        run: python -m pytest -q tests/test_build485_operational.py tests/test_build484_image_links.py tests/test_build483_research_leads.py tests/test_build483_operator.py tests/test_build482_operator.py tests/test_build481_evidence_bridge.py tests/test_canonical_closure478.py
      - name: Compile all code
        run: python -m compileall -q src/eagleeye eagleeye_pro
      - name: Historical full checkpoint
        run: python tools/run_checkpoint_regression480.py
      - name: Extended phase 18–20 checkpoint
        run: python tools/run_checkpoint_regression480.py --phase18-20
      - name: Install Chromium browser
        run: |
          python -m pip install 'playwright>=1.61,<2'
          python -m playwright install chromium
      - name: Real browser operational case, Dork, images, graph, report
        run: python -m pytest -q tests/test_build482_browser.py tests/test_build481_browser.py tests/test_build480_browser.py tests/test_advanced_workflows477.py
      - name: Install isolated Build 485
        run: python INSTALL_EAGLEEYE_485.py
      - name: Check isolated Build 485
        run: python INSTALL_EAGLEEYE_485.py --check
      - name: Installed desktop start Linux
        if: runner.os == 'Linux'
        run: python tools/desktop_acceptance476.py --runtime-python .eagleeye-runtime/bin/python
      - name: Installed desktop start Windows
        if: runner.os == 'Windows'
        run: python tools/desktop_acceptance476.py --runtime-python .eagleeye-runtime/Scripts/python.exe
      - name: Installed backup restore Linux
        if: runner.os == 'Linux'
        run: python tools/recovery_acceptance479.py --runtime-python .eagleeye-runtime/bin/python
      - name: Installed backup restore Windows
        if: runner.os == 'Windows'
        run: python tools/recovery_acceptance479.py --runtime-python .eagleeye-runtime/Scripts/python.exe
      - name: Real public DNS RDAP Crossref and verified Dossier restore (no network mocks)
        run: python tools/public_pilot485.py --output checkpoint485-live-public.json
      - name: Produce SHA-256 verified source distribution
        shell: bash
        run: |
          git archive --format=zip --output=EagleEye_Build_485_LAPTOP.zip HEAD
          python -c "import pathlib,zipfile,hashlib; p=pathlib.Path('EagleEye_Build_485_LAPTOP.zip'); z=zipfile.ZipFile(p); assert z.testzip() is None; assert {'START_EAGLEEYE_PRO.bat','INSTALL_EAGLEEYE_485.py','src/eagleeye/interfaces/web/app485.py','src/eagleeye/interfaces/web/pilot485.py'}.issubset(z.namelist()); pathlib.Path('EagleEye_Build_485_LAPTOP.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EagleEye_Build_485_HARD_GATE_${{ matrix.os }}
          path: |
            EagleEye_Build_485_LAPTOP.zip
            EagleEye_Build_485_LAPTOP.sha256
            checkpoint485-live-public.json
            recovery-acceptance479.json
          if-no-files-found: warn
          retention-days: 30
