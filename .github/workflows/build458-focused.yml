name: EagleEye Build 458 Focused

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-458:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install focused dependencies
        run: python -m pip install -e '.[test]'
      - name: Build 458 bounded document regression
        run: python -m pytest -q tests/test_build458_document_intelligence.py -k 'not test_build458_current_installer_and_next_checkpoint'
      - name: Compile Build 458 surfaces
        run: python -m compileall -q eagleeye_pro/phase20 src/eagleeye/application/build458 src/eagleeye/interfaces/web
      - name: Install isolated Build 458 runtime
        if: false
        run: python INSTALL_EAGLEEYE_458.py
      - name: Verify isolated Build 458 runtime
        if: false
        run: python INSTALL_EAGLEEYE_458.py --check
      - name: Linux isolated import
        if: false
        run: .eagleeye-runtime/bin/python -I -c "import importlib.metadata, eagleeye.interfaces.web.server as s; assert importlib.metadata.version('eagleeye-personosint-pro') == '458.0.0'; assert '.eagleeye-runtime' in s.__file__; print(s.__file__)"
      - name: Windows isolated import
        if: false
        run: .eagleeye-runtime\\Scripts\\python.exe -I -c "import importlib.metadata, eagleeye.interfaces.web.server as s; assert importlib.metadata.version('eagleeye-personosint-pro') == '458.0.0'; assert '.eagleeye-runtime' in s.__file__; print(s.__file__)"
      - name: Package exact-head tested Build 458
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git archive --format=zip --output EagleEye_Build_458_SOURCE.zip HEAD
          sha256sum EagleEye_Build_458_SOURCE.zip > EagleEye_Build_458_SOURCE.sha256
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: EagleEye_Build_458_SOURCE
          path: |
            EagleEye_Build_458_SOURCE.zip
            EagleEye_Build_458_SOURCE.sha256
          if-no-files-found: error
          retention-days: 30
