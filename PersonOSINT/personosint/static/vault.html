<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>EagleEye Vault</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='6' fill='%230b1f38'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23facc15'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/vault/static/vault.css">
</head>
<body class="vault-screen">
  <main class="vault-wrap">
    <header class="vault-brand">
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="4" width="40" height="40" rx="9" fill="#0b1f38" stroke="#facc15" stroke-width="2.5"/><circle cx="24" cy="24" r="9" fill="none" stroke="#facc15" stroke-width="3"/><circle cx="24" cy="24" r="3" fill="#facc15"/><path d="M24 15v-4M24 37v-4M15 24h-4M37 24h-4" stroke="#facc15" stroke-width="3" stroke-linecap="round"/></svg>
      <div><b>EagleEye Vault</b><span>Private Recherche-Station</span></div>
    </header>
    <ul class="vault-facts" aria-label="Schutz">
      <li><span class="dot ok"></span>Daten verschlüsselt</li>
      <li><span class="dot ok"></span>Nur dieser Rechner</li>
      <li><span class="dot off"></span>Internet aus</li>
    </ul>
    <section id="vault-card" class="vault-card" aria-live="polite">
      <p class="muted">Wird geladen …</p>
    </section>
    <footer class="vault-foot muted" id="vault-foot"></footer>
  </main>
  <script src="/vault/static/vault.js"></script>
</body>
</html>
