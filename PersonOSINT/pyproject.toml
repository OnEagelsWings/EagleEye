[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eagleeye-personosint"
dynamic = ["version"]
description = "EagleEye PersonOSINT – Personen-, Vermissten- und Verbindungsrecherche mit belegten Dossiers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-docx>=1.1,<2",
  "Pillow>=13,<14",
  "python-multipart>=0.0.18,<1",
  "cryptography>=42,<51",
  "argon2-cffi>=23.1,<26",
  "segno>=1.6,<2",
  "warcio>=1.7,<2",
  "trafilatura>=2.0,<3",
  "rapidfuzz>=3.9,<4",
  "anyascii>=0.3.2,<1",
  "pypdf>=5,<7",
  "pypdfium2>=4.30,<6",
  "pytesseract>=0.3.13,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
personosint = "personosint.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "personosint.__version__"}

[tool.setuptools.packages.find]
include = ["personosint*"]

[tool.setuptools.package-data]
personosint = ["static/*", "static/vendor/**/*"]
