<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EagleEye · Lokale Analyse</title>
<style>body{font:16px/1.5 system-ui;background:#eff4ef;color:#142b22;margin:0}main{max-width:790px;margin:3rem auto;background:white;border:1px solid #cad7cf;border-radius:12px;padding:clamp(1rem,5vw,3rem)}label{display:block;font-weight:650;margin-top:1rem}input,textarea,select{box-sizing:border-box;width:100%;font:inherit;padding:.6rem;border:1px solid #869d90;border-radius:6px}button{color:white;background:#214833;padding:.7rem 1rem;border:0;border-radius:6px;font:inherit;margin:.8rem .4rem 0 0}button:disabled{opacity:.55}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:26rem;overflow:auto}p{color:#43564a}small{display:block}</style>
<main><h1>Lokale Analyse</h1><form id="form"><label for="caseid">Fallkennung</label><input id="caseid" required maxlength="100"><label for="tool">Werkzeug</label><select id="tool"></select><p id="hint"></p><div id="fileGroup"><label for="paths">Lokale Dateipfade</label><textarea rows="3" id="paths" placeholder="Ein vollständiger Pfad je Zeile"></textarea><small>Windows: Im Explorer „Als Pfad kopieren“ wählen und hier einfügen.</small></div><div id="queryGroup"><label for="query" id="queryLabel">Suchbegriff</label><input id="query" maxlength="200"></div><div id="offsetGroup" hidden><label for="offset">Startsektor des Dateisystems im Abbild</label><input id="offset" value="0" type="number" min="0"></div><p id="availability" role="status"></p><button id="run">Analyse starten</button></form><section id="results" hidden><h2>Befund prüfen</h2><pre id="out"></pre><button id="send">Befund an Sites übergeben</button><button id="download">Befund als JSON speichern</button></section><p id="msg" role="status"></p></main>
<script>
const el=id=>document.getElementById(id), site='https://eagleeye-investigation.m-sprenger222.chatgpt.site',params=new URLSearchParams(location.hash.slice(1));
const hints={pcap:"Eine vorhandene PCAP- oder PCAPNG-Datei auswählen.",zap:"Eine HAR-Datei mit aufgezeichneten HTTP-Antworten auswählen. Die Anfragen werden nicht erneut gesendet.",leaks:"Pfad eines lokalen Git-Arbeitsordners eingeben. Geprüft wird die Historie des aktuellen Commits.",yara:"Erste Zeile: Regeldatei. Weitere Zeilen: Dateien zur Prüfung.",inventory:"Zwei Nmap-XML-Dateien angeben: zuerst die ältere, dann die neuere.",lynis:"Unter Windows lynis-report.dat angeben. Unter Linux löst ein leeres Feld ein lokales Systemaudit aus.",metadata:'Metadaten der gewählten Bilder lesen.',search:'Volltextsuche in einer temporären Kopie der ausgewählten Dokumente.',ocr:'Eine durchsuchbare PDF-Arbeitskopie erzeugen.',video:'Ein oder zwei Videos untersuchen und Einzelbilder bei 10, 50 und 90 Prozent speichern.',alias:'Sherlock fragt öffentliche Plattformen nach diesem Benutzernamen ab. Treffer sind Profilkandidaten.',timeline:'Dateisystem-Zeitleiste aus einem lokalen Datenträgerabbild erstellen.'};
let caps={}, report;
el('caseid').value=params.get('caseId')||'';
function update(){
 const k=el('tool').value,c=caps[k];if(!c)return;
 el('fileGroup').hidden=k==='alias';el('paths').required=!['alias','lynis'].includes(k);el('queryGroup').hidden=!['alias','search','ocr'].includes(k);el('queryLabel').textContent=k==='alias'?'Öffentlicher Benutzername':k==='ocr'?'OCR-Sprachcodes':'Suchbegriff';el('query').value=k==='ocr'?'deu+eng':'';el('offsetGroup').hidden=k!=='timeline';el('hint').textContent=c.label.includes('Poppler')?'Wörtliche Suche in PDF-, TXT- und Markdown-Dateien mit Seite und Zeile.':hints[k];
 el('availability').textContent=c.missing.length?'Auf diesem Gerät fehlen: '+c.missing.join(', '):'Werkzeuge auf diesem Gerät gefunden.';el('run').disabled=!!c.missing.length;
}
fetch('/status').then(r=>r.json()).then(d=>{caps=d;for(const [k,c] of Object.entries(d))el('tool').add(new Option(c.label,k));if(caps[params.get('tool')])el('tool').value=params.get('tool');update()}).catch(()=>el('msg').textContent='Werkzeugstatus nicht erreichbar.');
el('tool').onchange=update;
el('form').onsubmit=async e=>{e.preventDefault();el('run').disabled=true;el('results').hidden=true;el('msg').textContent='Analyse läuft …';try{
 const k=el('tool').value;const res=await fetch('/run',{method:'POST',headers:{'Content-Type':'application/json','X-Local-Key':'{{token}}'},body:JSON.stringify({caseId:el('caseid').value,tool:k,paths:k==='alias'?[]:el('paths').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean),query:el('queryGroup').hidden?'':el('query').value,offset:el('offset').value})});const data=await res.json();if(!res.ok)throw Error(data.error);report=data.report;el('out').textContent=report.body;el('msg').textContent='Vollständige Ausgabe: '+data.folder;el('results').hidden=false;el('send').hidden=!window.opener;
}catch(err){el('msg').textContent=String(err)}finally{el('run').disabled=false}};
el('send').onclick=()=>{if(window.opener){window.opener.postMessage({kind:'eagleeye-analysis',report},site);el('msg').textContent='Zur Sites-Seite wechseln und den Befund prüfen. Falls er dort fehlt, die JSON-Datei importieren.'}};
el('download').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='Befund-'+report.id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
</script></html>
